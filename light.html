(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const viewport = document.getElementById("viewport");
  const read = document.getElementById("read");
  const feats = DATA.features;
  const henges = DATA.henges || [];
  const p8647 = feats.find(function (f) { return f.id === "8647"; });
  const p9019 = feats.find(function (f) { return f.id === "9019"; });

  let pad = 28;
  const es = feats.map(function (f) { return f.e; });
  const ns = feats.map(function (f) { return f.n; });
  const E0 = Math.min.apply(null, es) - pad;
  const E1 = Math.max.apply(null, es) + pad;
  const N0 = Math.min.apply(null, ns) - pad;
  const N1 = Math.max.apply(null, ns) + pad;
  const worldW = E1 - E0;
  const worldH = N1 - N0;

  let scale = 1, tx = 0, ty = 0, fit = 1;
  let showAlign = true, showLabs = true, sel = null;
  let dragging = false, moved = false, lastX = 0, lastY = 0, lastPinch = 0;

  function resize() {
    const r = viewport.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fitView();
  }
  function fitView() {
    const r = viewport.getBoundingClientRect();
    fit = Math.min(r.width / worldW, r.height / worldH) * 0.92;
    scale = fit;
    tx = (r.width - worldW * scale) / 2;
    ty = (r.height - worldH * scale) / 2;
    draw();
  }
  function enToView(e, n) {
    return { x: tx + (e - E0) * scale, y: ty + (N1 - n) * scale };
  }
  function viewToEn(x, y) {
    return { e: E0 + (x - tx) / scale, n: N1 - (y - ty) / scale };
  }
  function nearest(e, n) {
    let best = null, bd = 1e9;
    const hit = 10 / scale;
    for (let i = 0; i < feats.length; i++) {
      const f = feats[i];
      const d = Math.hypot(f.e - e, f.n - n);
      if (d < bd) { bd = d; best = f; }
    }
    return bd <= Math.max(hit, 2.2) ? best : null;
  }
  function colour(kind) {
    if (kind === "post") return "#c42828";
    if (kind === "base") return "#d97706";
    if (kind === "axis") return "#b4532a";
    if (kind === "henge") return "#3d6b8a";
    return "#4b5563";
  }
  function radius(kind) {
    if (kind === "post") return Math.max(5, 1.3 * scale);
    if (kind === "base") return Math.max(4.5, 1.1 * scale);
    if (kind === "henge") return Math.max(4, scale);
    return Math.max(3.5, 0.85 * scale);
  }
  function draw() {
    const r = viewport.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.fillStyle = "#fbfaf6";
    ctx.fillRect(0, 0, r.width, r.height);

    ctx.save();
    ctx.beginPath();
    const g0 = Math.ceil(E0 / 10) * 10;
    ctx.strokeStyle = "#ece7dc";
    ctx.lineWidth = 1;
    for (let e = g0; e <= E1; e += 10) {
      const p = enToView(e, N0);
      const q = enToView(e, N1);
      ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
    }
    const n0 = Math.ceil(N0 / 10) * 10;
    for (let n = n0; n <= N1; n += 10) {
      const p = enToView(E0, n);
      const q = enToView(E1, n);
      ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
    }
    ctx.stroke();
    ctx.restore();

    henges.forEach(function (h) {
      const p = enToView(h.e, h.n);
      ctx.beginPath();
      ctx.arc(p.x, p.y, h.r * scale, 0, Math.PI * 2);
      ctx.strokeStyle = "#93b4c9";
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    if (showAlign && p8647 && p9019) {
      const a = enToView(p8647.e, p8647.n);
      const b = enToView(p9019.e, p9019.n);
      const dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1;
      const ux = dx / L, uy = dy / L;
      const ext = 80 * scale;
      ctx.beginPath();
      ctx.moveTo(a.x - ux * ext, a.y - uy * ext);
      ctx.lineTo(b.x + ux * ext, b.y + uy * ext);
      ctx.strokeStyle = "#c42828";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    feats.forEach(function (f) {
      const p = enToView(f.e, f.n);
      const rad = radius(f.kind);
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      if (f.kind === "post" || f.kind === "base") {
        ctx.fillStyle = colour(f.kind);
        ctx.fill();
      } else {
        ctx.strokeStyle = colour(f.kind);
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
      if (sel && sel.id === f.id) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad + 4, 0, Math.PI * 2);
        ctx.strokeStyle = "#9a3412";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    });

    if (showLabs) {
      ctx.font = "600 11px Calibri, sans-serif";
      ctx.fillStyle = "#1b3a4b";
      feats.forEach(function (f) {
        if (f.kind !== "post" && f.kind !== "base" && !(sel && sel.id === f.id)) return;
        const p = enToView(f.e, f.n);
        ctx.fillText(f.id, p.x + 7, p.y - 7);
      });
    }

    const s0 = enToView(E0 + 8, N0 + 8);
    const s1 = enToView(E0 + 18, N0 + 8);
    ctx.strokeStyle = "#1b3a4b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s0.x, s0.y);
    ctx.lineTo(s1.x, s1.y);
    ctx.stroke();
    ctx.font = "12px Calibri, sans-serif";
    ctx.fillStyle = "#1b3a4b";
    ctx.fillText("10 m", s0.x, s0.y - 6);
    ctx.fillText("N", r.width - 22, 22);
  }

  function client(ev) {
    const r = viewport.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function zoomAt(cx, cy, factor) {
    const en = viewToEn(cx, cy);
    const next = Math.min(fit * 18, Math.max(fit * 0.7, scale * factor));
    scale = next;
    const p = enToView(en.e, en.n);
    tx += cx - p.x;
    ty += cy - p.y;
    draw();
  }
  function describe(f) {
    if (!f) { read.textContent = "Drag to pan · pinch or scroll to zoom · tap a pit"; return; }
    read.textContent = f.id + "  " + f.kind + "  E " + f.e.toFixed(1) + "  N " + f.n.toFixed(1) + "  " + f.su;
  }

  viewport.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    const p = client(ev);
    zoomAt(p.x, p.y, ev.deltaY < 0 ? 1.14 : 1 / 1.14);
  }, { passive: false });

  viewport.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return;
    dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY;
    viewport.setPointerCapture(ev.pointerId);
  });
  viewport.addEventListener("pointermove", function (ev) {
    if (dragging) {
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      if (Math.hypot(dx, dy) > 4) moved = true;
      if (moved) {
        tx += dx; ty += dy; lastX = ev.clientX; lastY = ev.clientY; draw();
      }
      return;
    }
    const p = client(ev);
    const en = viewToEn(p.x, p.y);
    const f = nearest(en.e, en.n);
    if (!sel) describe(f);
  });
  viewport.addEventListener("pointerup", function (ev) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      const p = client(ev);
      const en = viewToEn(p.x, p.y);
      sel = nearest(en.e, en.n);
      describe(sel);
      draw();
    }
  });
  viewport.addEventListener("pointercancel", function () { dragging = false; });

  viewport.addEventListener("touchstart", function (ev) {
    if (ev.touches.length === 2) {
      const a = ev.touches[0], b = ev.touches[1];
      lastPinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }
  }, { passive: true });
  viewport.addEventListener("touchmove", function (ev) {
    if (ev.touches.length === 2) {
      ev.preventDefault();
      const a = ev.touches[0], b = ev.touches[1];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (lastPinch) {
        const r = viewport.getBoundingClientRect();
        zoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, d / lastPinch);
      }
      lastPinch = d;
    }
  }, { passive: false });
  viewport.addEventListener("touchend", function () { lastPinch = 0; });

  document.getElementById("zoom-in").onclick = function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1.25);
  };
  document.getElementById("zoom-out").onclick = function () {
    const r = viewport.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1 / 1.25);
  };
  document.getElementById("reset").onclick = function () { sel = null; describe(null); fitView(); };
  document.getElementById("align").onclick = function () {
    showAlign = !showAlign; this.className = showAlign ? "active" : ""; draw();
  };
  document.getElementById("labs").onclick = function () {
    showLabs = !showLabs; this.className = showLabs ? "active" : ""; draw();
  };
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
